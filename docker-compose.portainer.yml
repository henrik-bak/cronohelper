# Portainer stack variant.
#
# The one thing that must differ from docker-compose.unraid.yml: there is no
# `env_file:` here. `env_file:` requires a literal .env file next to the
# compose file, and .env is gitignored (it holds your Cronometer password), so
# it is not in the clone — Portainer fails with
# "env file /data/compose/<id>/.env not found" before starting anything.
#
# Portainer's "Environment variables" panel feeds ${VAR} substitution, not
# env_file, so credentials are declared under `environment:` below. That is
# also the better arrangement: the password lives in Portainer rather than in
# a plaintext file on a share.
#
# DEPLOY (Repository — recommended, Portainer builds it):
#   Stacks -> Add stack -> Repository
#     Repository URL   https://github.com/henrik-bak/cronohelper
#     Compose path     docker-compose.portainer.yml
#   Add these under "Environment variables":
#     CRONOMETER_USERNAME   your Cronometer account email
#     CRONOMETER_PASSWORD   your Cronometer password
#     TZ                    Europe/Budapest
#     PORT                  8080
#
# DEPLOY (Web editor — no build context available):
#   Build the image over SSH first:
#       cd /mnt/user/projects/cronohelper && docker build -t cronohelper:latest .
#   then paste this file with `build: .` replaced by `image: cronohelper:latest`,
#   and turn OFF any "pull latest image" / "re-pull image" toggle — the image
#   is local only and a pull will fail.
#
# ONE-TIME, on the Unraid box either way — nothing automates this:
#     mkdir -p /mnt/user/appdata/cronohelper
#     chown -R 99:100 /mnt/user/appdata/cronohelper
#
services:
  cronohelper:
    # `build:` with NO `image:` key, deliberately. Portainer runs a pull before
    # `up`, and `docker compose pull` skips a service that only has `build:`
    # ("No image to be pulled") — but if an `image:` name is also present it
    # tries to pull *that*, and fails:
    #
    #     pull access denied for cronohelper, repository does not exist
    #
    # because the image only ever exists locally. Without `image:` the pull is
    # skipped and `up` builds it, which is what we want.
    #
    # For the Web-editor route below there is no build context, so there you
    # DO add `image: cronohelper:latest` and remove this `build:` line.
    build: .
    container_name: cronohelper
    restart: unless-stopped

    # Unraid's nobody:users. Must match the owner of the appdata directory —
    # the image's own uid is 10001 and cannot write there. Symptom if this is
    # wrong: /healthz returns ok, every other endpoint returns 500.
    user: "99:100"

    environment:
      # These come from Portainer's Environment variables panel. The `:?`
      # guards make a missing one fail the deploy with a message naming the
      # variable, rather than starting a container that dies at login time.
      CRONOMETER_USERNAME: ${CRONOMETER_USERNAME:?set this in the Portainer stack UI}
      CRONOMETER_PASSWORD: ${CRONOMETER_PASSWORD:?set this in the Portainer stack UI}
      # Diary entries are stamped in the account timezone.
      TZ: ${TZ:-Europe/Budapest}
      DATA_DIR: /data

    ports:
      # LAN-visible. No authentication in front of it — do not port-forward.
      - "${PORT:-8080}:8080"

    volumes:
      # SQLite database, food-id cache, and the Cronometer session token.
      - /mnt/user/appdata/cronohelper:/data
